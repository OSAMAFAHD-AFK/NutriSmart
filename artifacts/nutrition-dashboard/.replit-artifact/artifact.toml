kind = "web"
previewPath = "/"
title = "Yemen Nutrition Monitoring System"
version = "1.0.0"
id = "artifacts/nutrition-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24440

[services.development]
run = "pnpm --filter @workspace/nutrition-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nutrition-dashboard", "run", "build" ]
publicDir = "artifacts/nutrition-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24440"
BASE_PATH = "/"
